    <!-- ================= AREA UJIAN (CBT) ================= -->

            </div>
        </header>

        <main class="p-5">
            <div id="konten-wacana" class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-lg text-sm md:text-base leading-relaxed hidden"></div>
            <div id="konten-pertanyaan" class="font-bold text-gray-900 mb-4 text-base md:text-lg"></div>
            <div id="wadah-pilihan" class="flex flex-col gap-2"></div>

        <footer class="fixed bottom-0 w-full max-w-2xl bg-white border-t border-gray-200 p-4 flex justify-between gap-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">

            <button id="btn-selesai" onclick="kumpulkanJawaban(false)" class="flex-1 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition hidden">Selesai Ujian</button>
        </footer>
    </div>

        const wacanaMangrove = `
            <p style="margin-bottom: 10px; font-weight: bold; text-align: center;">Indahnya Hutan-Hutan Mangrove di Indonesia</p>
            <p style="margin-bottom: 8px; text-align: justify;">Hutan Mangrove di Kulon Progo, Yogyakarta adalah tempat yang menyuguhkan keindahan alam menyejukkan hati. Hutan ini terletak di dekat Pantai Congot, kawasan ini terbagi menjadi beberapa zona menarik seperti Pasir Mendit, Jembatan Api-Api, dan Pantai Kadilangu. Luasnya mencapai sekitar tiga kilometer persegi, dipenuhi pohon-pohon bakau dengan akar unik yang menjulur di atas air.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Begitu melangkah ke dalam area, pengunjung akan disambut oleh jembatan kayu dan suasana rindang yang membuat hati tenang. Banyak spot foto menarik seperti ayunan, gazebo, dan menara pandang. Tak heran jika tempat ini disebut sebagai "permata tersembunyi" di Kulon Progo.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Selain indah, hutan ini juga menjadi rumah bagi beragam satwa seperti burung kuntul, kepiting, udang, dan biawak kecil. Ada jalur kayu yang bisa dilewati sambil menikmati semilir angin pantai. Jika ingin lebih dekat dengan alam, pengunjung juga bisa naik perahu menyusuri rimbunnya hutan.</p>
            <p style="margin-bottom: 15px; text-align: justify;">Hutan Mangrove Kulon Progo bukan hanya indah dipandang mata, tapi juga punya peran penting bagi lingkungan. Tempat ini ibarat "paru-paru kecil" pesisir yang menjaga alam tetap seimbang sekaligus menjadi lokasi belajar mencintai alam sejak dini.</p>
        `;
        const wacanaBakwan = `
            <img src="soal4.png">
            <p style="margin-bottom: 8px; text-align: justify;">Bakwan merupakan makanan unik yang banyak disukai. Bakwan muncul karena pengaruh dari berbagai budaya, seperti Cina, Jepang, bahkan Eropa (Portugis).</p>
            <p style="margin-bottom: 8px; text-align: justify;">Awalnya, bakwan terbuat dari daging dan tepung yang digoreng. Di Jepang, sayur yang digoreng tepung disebut "tempura". Makanan tersebut bisa jadi ikut mempengaruhi berkembangnya bakwan di Indonesia.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Kini, bakwan berisi aneka sayuran, seperti taoge, kol, dan wortel, yang dicampur dengan adonan tepung berbumbu rempah. Bisa juga ditambahkan isian udang, sosis, atau bakso.</p>
            <p style="margin-bottom: 15px; text-align: justify;">Nama bakwan berbeda di tiap daerah. Jakarta, Yogyakarta, Manado, dan Lampung menyebutnya bakwan. Di banyak kota di Jawa Timur disebut ote-ote atau weci. Di Bandung disebut bala-bala. Sementara, di Semarang dan Pekalongan disebut badak.</p>
        `;
        const wacanaBotol = `
            <p style="margin-bottom: 8px; text-align: justify;">Salma, Alvin, dan Siva sedang menikmati waktu istirahat.</p>
            <p style="margin-bottom: 8px; text-align: justify;"><strong>Salma:</strong> (memeluk botol minumnya) "Minum dulu, ah! Botolku ini hadiah dari Ibu waktu ulang tahun. Aku beri nama dia Si Biru."</p>
            <p style="margin-bottom: 8px; text-align: justify;"><strong>Alvin:</strong> "Hah? Botol aja dikasih nama? Aneh banget, Sal!"</p>
            <p style="margin-bottom: 8px; text-align: justify;"><strong>Siva:</strong> "Ih, botol minum Salma lucu banget. Kamu tiap hari bawa Si Biru, ya?"</p>
            <p style="margin-bottom: 8px; text-align: justify;"><strong>Salma:</strong> "Iya, dong. Si Biru sudah menemani aku setahun ini. Aku jadi nggak pernah beli minuman kemasan lagi!"</p>
            <p style="margin-bottom: 8px; text-align: justify;"><strong>Alvin:</strong> "Ah, ribet. Aku sih, tinggal beli aja. Kalau sudah habis tinggal buang." (mengejek Salma)</p>
            <p style="margin-bottom: 8px; text-align: justify;"><strong>Salma:</strong> "Vin, tahu, nggak? Plastik yang kamu buang itu bisa jadi sampah lingkungan bertahun-tahun. Bisa mencemari tanah dan air juga, lho."</p>

            <p style="margin-bottom: 8px; text-align: justify;"><strong>Alvin:</strong> "Hmm, kalau aku punya botol keren, mungkin aku jadi ingin bawa botol."</p>
            <p style="margin-bottom: 8px; text-align: justify;"><strong>Salma:</strong> "Benar sekali. Kita bantu cari botol yang cocok buat kamu, deh."</p>
            <p style="margin-bottom: 8px; text-align: justify;"><strong>Alvin:</strong> "Oke, setuju! Aku mau botol warna oranye, biar beda dari yang lain!"</p>
            <p style="margin-bottom: 15px; text-align: justify;"><strong>Siva:</strong> "Siap, nanti kita cari bersama, ya!"</p>
        `;
        const wacanaMeteor = `
            <img src="soal9.png">
            <p style="margin-bottom: 8px; text-align: justify;">Buku harianku,</p>
            <p style="margin-bottom: 8px; text-align: justify;">Ayah akan mengajakku melihat hujan meteor. Meteor adalah batu atau debu antar-planet. Ketika meteor jatuh ke bumi, meteor terbakar karena gesekan lapisan udara bumi. Itu sebabnya, meteor terlihat seperti bintang jatuh atau bintang berpindah.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Aku berdoa supaya hari itu tidak hujan. Meteor tampak lebih jelas jika langit cerah. Jika aku beruntung, aku dapat melihat belasan meteor per jam.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Awalnya aku khawatir kalau bintang jatuh dapat menimpaku. Untunglah, ayah sudah menenangkanku. Hujan meteor tidak berbahaya, kok. Jangan takut, meteor ini akan habis terbakar di langit.</p>

        const wacanaGiga = `
            <img src="soal11.png">
            <p style="margin-bottom: 8px; text-align: justify;">Giga si Segitiga mempunyai banyak ide. Dia senang menirukan bentuk. Dia sering mengajak teman-temannya bermain bersama.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Banyak bentuk yang bisa ditiru. Bentuk dan sudut yang sama membuat mereka selalu serasi. Contohnya pohon cemara, gunung, atap rumah, bendera, dan kipas angin.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Giga juga suka bermain dengan Pasukan Kotak. Banyak bentuk yang bisa ditirukan, seperti roket, ikan, dan menara. Saat bermain dengan Heksagonal, dia menirukan bentuk bunga.</p>

        `;
        const wacanaCapGoMeh = `
            <img src="soal13.png">

            <p style="margin-bottom: 8px; text-align: justify;">Adit dan Danu senang sekali hari ini karena Ibu dan Ayah akan mengajak mereka pergi melihat perayaan Cap Go Meh di Pulau Kemaro. Masyarakat Tionghoa di Kota Palembang merayakan Cap Go Meh, dan orangtuanya ingin mengenalkan perayaan tersebut kepada mereka.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Ini adalah kedua kalinya Adit dan Danu pergi ke Pulau Kemaro. Waktu itu, mereka naik kapal dari bawah jembatan Musi. Kali ini, mereka akan menyeberangi sungai Musi dengan berjalan kaki di atas jembatan ponton, yang dipasang khusus saat perayaan Imlek setiap tahunnya. Mereka berangkat setelah makan malam.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Malam itu, banyak orang berjalan kaki melewati jembatan ponton ke Pulau Kemaro. Semua orang memakai baju merah, termasuk keluarga Adit dan Danu. Di Pulau Kemaro, mereka menyaksikan pertunjukkan barongsai dan penerbangan lampion. Acaranya sangat meriah. Adit dan Danu senang bisa mengenal kebudayaan Tionghoa melalui perayaan Cap Go Meh.</p>
            <p style="margin-bottom: 15px; text-align: justify;">Namun, ketika mereka tiba di Pulau Kemaro, mereka kecewa karena hujan deras turun. Pertunjukkan barongsai dan penerbangan lampion harus dibatalkan. Adit dan Danu merasa sedih karena tidak bisa melihat semua acara yang telah mereka nantikan. Meskipun begitu, mereka tetap berusaha menikmati perayaan Cap Go Meh dengan berkeliling pulau dan mencoba makanan khas Imlek. Mereka belajar bahwa tidak semua hal bisa berjalan sesuai rencana, dan yang terpenting adalah tetap bersyukur dan menjalani dengan baik apa yang ada.</p>
        `;
        const wacanaKota = `
            <img src="soal16.png">
            <p style="margin-bottom: 8px; text-align: justify;">Perubahan iklim, bencana alam, dan kesehatan manusia adalah masalah serius. Untuk mengatasinya, pemerintah berupaya membangun kota berkelanjutan. Kita perlu tahu ciri-ciri kota yang nyaman dan sehat.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Kota berkelanjutan memiliki transportasi publik ramah lingkungan dan murah. Bus dan kereta tidak mencemari udara serta terjangkau. Kendaraan pribadi juga harus ramah lingkungan, seperti mobil listrik. Kota ini menyediakan jalur khusus untuk pejalan kaki dan pesepeda.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Listrik di kota berkelanjutan berasal dari tenaga surya. Gedung-gedung dirancang hemat energi dan ramah lingkungan. Penggunaan air pun dilakukan secara bijak dan efisien. Fasilitas publik mudah diakses oleh semua orang. Taman, perpustakaan, dan rumah sakit tersedia di berbagai lokasi.</p>
            <p style="margin-bottom: 15px; text-align: justify;">Kota juga memiliki ruang terbuka hijau yang nyaman dan asri. Kota berkelanjutan memperhatikan produksi makanan ramah lingkungan. Pengelolaan sampah dilakukan dengan baik, termasuk daur ulang sampah. Dengan semua ciri-ciri ini, kota menjadi sehat, nyaman, dan ramah lingkungan. Mari jaga kota kita agar tetap berkelanjutan!</p>
        `;
        const wacanaRuwatan = `
            <img src="soal19.png">
            <p style="margin-bottom: 8px; text-align: justify;">"Pokoknya Rara mau hp sebelum ruwatan!" Rengek Rara.</p>
            <p style="margin-bottom: 8px; text-align: justify;">"Maaf, Nak! Ibu belum bisa membelikannya!" Terang Ibu.</p>
            <p style="margin-bottom: 8px; text-align: justify;">"Jadi Rara tidak bisa ikut tradisi ruwatan?" tanyanya kesal. Ibu sedih mendengar pertanyaan Rara. Ayah yang tidak sengaja lewat, ikut mendengar.</p>
            <p style="margin-bottom: 8px; text-align: justify;">"Rara! Kamu minta hp?" Tanya Ayah.</p>
            <p style="margin-bottom: 8px; text-align: justify;">"Iya!" Jawabnya. "Kata ketua adat, Rara boleh minta satu permintaan ke ayah ibu. Trus, permintaan Rara itu harus dipenuhi, baru Rara bisa ikut ruwatan, Yah!" Lanjut Rara.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Ayah mengangguk, dan perlahan menjelaskan keadaan mereka. Ibunya seorang pedagang kecil dan ayah hanya penjaga vila. Jadi cukup berat untuk membelikan hp. Rara sadar, dirinya tidak kaya dan meminta maaf ke Ayah dan Ibu. Akhirnya Rara hanya meminta dibelikan buku cerita di pasar.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Tibalah hari Ruwatan, saat rambut Rara akan dipotong. Rara sudah bersiap dengan baju adat. "Wuah, bagus bajunya!" Kata Rara takjup. "Ayo, Nak! Kamu harus segera bergabung dengan teman lainnya!" Perintah Ibu.</p>
            <p style="margin-bottom: 8px; text-align: justify;">"Mau kemana, Bu?" Tanya Rara. Ibu menjelaskan kalau Rara akan dibawa ke tempat ritual ruwatan. Di sana Ketua adat akan memotong rambut gimbal Rara.</p>

            <p style="margin-bottom: 8px; text-align: justify;">"Asik! Terima kasih, Bu!" ucap Rara. "Tapi kamu harus tetap ikut acara larung rambut, ya, di sungai dekat desa!"</p>

        const wacanaArul = `
            <img src="soal22.png" style="max-width: 150px;">
            <p style="margin-bottom: 8px; text-align: justify;">Nilai Arul selalu bagus sejak dulu. Padahal, dia tidak pernah belajar. Tapi, nilai Arul mulai menurun.</p>
            <p style="margin-bottom: 8px; text-align: justify;"><strong>Dewi:</strong> "Arul, belajar bareng, yuk! Bareng Reno dan Erni."<br><strong>Arul:</strong> "Enggak mau, ah! Aku malas."<br><strong>Dewi:</strong> "Ya, sudah. Aku belajar bareng dulu, ya."<br><strong>Arul:</strong> "Belajar saja sana. Paling nilainya lebih bagus aku. Mending aku main bola."</p>
            <p style="margin-bottom: 8px; text-align: justify;">Arul kembali bermain. Dia mengambil sepatunya. Dia berlari ke lapangan sambil membawa bola. Dia menendang bola ke gawang yang kosong.</p>
            <p style="margin-bottom: 8px; text-align: justify;">Keesokan hari setelah ujian, Arul kaget saat melihat nilainya.<br><strong>Arul:</strong> "Kok nilaiku jelek banget?"<br><strong>Reno:</strong> "Emang apa yang kamu pelajari, Rul?"<br><strong>Arul:</strong> "Buat apa aku belajar? Nilaiku loh selalu bagus."<br><strong>Erni:</strong> "Ya, enggak bisa begitu, Arul. Pelajaran kita kan semakin susah."<br><strong>Dewi:</strong> "Iya, kita sudah harus rajin belajar."<br><strong>Arul:</strong> "Dulu aku tidak belajar. Nilaiku juga selalu bagus, 'kan?"<br><strong>Reno:</strong> "Iya. Itu 'kan dulu. Lihat nilaimu sekarang. Semakin lama semakin jelek, 'kan?"</p>

        const wacanaNelayan = `

            <p style="margin-bottom: 8px; text-align: justify;">Hal ini sangat berbeda dengan Kamal. Padahal keduanya sama-sama mencari hidup di laut. Tapi, Kamal sering bermalas-malasan.</p>

            <p style="margin-bottom: 15px; text-align: justify;">Kamal hanya terdiam. Kamal memang sudah semakin susah meminta ikan. Dengan berat, Kamal melawan rasa malasnya. Ia ikut Yunus melaut. Setiap hari, Kamal ikut dengan Yunus. Sekarang Kamal sudah melaut setiap hari. Kamal bahkan melaut dengan perahunya sendiri.</p>

        const wacanaLianne = `

        // 3. LOGIKA CBT OFFLINE & TIMER

        function mulaiUjian() {
            namaAktif = document.getElementById('input-nama').value.trim();
            if (!namaAktif) {
                alert("Namamu belum diisi, ayo isi dulu!");
                return;
            }

            document.getElementById('layar-login').classList.add('hidden');
            document.getElementById('area-ujian').classList.remove('hidden');
            document.getElementById('header-nama-siswa').innerText = namaAktif;
            
            const saved = localStorage.getItem('jawaban_bhs_' + namaAktif);
            if(saved) {
                jawabanSiswa = JSON.parse(saved);
                currentIndex = parseInt(localStorage.getItem('index_bhs_' + namaAktif)) || 0;
            } else {
                jawabanSiswa = new Array(paketSoalTKA.length).fill(null);
            }
            
            renderSoal(currentIndex);
            jalankanTimer();
        }

        function jalankanTimer() {
            const timerElemen = document.getElementById('timer-display');
            
            timerInterval = setInterval(() => {
                waktuSisa--;
                
                let menit = Math.floor(waktuSisa / 60);
                let detik = waktuSisa % 60;
                
                timerElemen.innerText = `${menit.toString().padStart(2, '0')}:${detik.toString().padStart(2, '0')}`;
                
                if (waktuSisa <= 180 && waktuSisa > 0) {
                    timerElemen.classList.add('waktu-habis');
                }

                if (waktuSisa <= 0) {
                    clearInterval(timerInterval);
                    timerElemen.innerText = "00:00";
                    alert("WAKTU HABIS! Jawabanmu otomatis dikumpulkan.");
                    kumpulkanJawaban(true);
                }
            }, 1000);
        }

        function simpanJawabanSaatIni() {
            const container = document.getElementById('wadah-pilihan');
            const inputs = container.querySelectorAll('input:checked');
            
            jawabanSiswa[currentIndex] = Array.from(inputs).map(el => {
                return el.value.includes('_') ? el.value : parseInt(el.value);
            });
            
            localStorage.setItem('jawaban_bhs_' + namaAktif, JSON.stringify(jawabanSiswa));
            localStorage.setItem('index_bhs_' + namaAktif, currentIndex);
        }

        function renderSoal(indeks) {
            const s = paketSoalTKA[indeks];
            document.getElementById('nomor-soal-display').innerText = `${indeks + 1}/30`;
            
            const wadahWacana = document.getElementById('konten-wacana');
            if(s.wacana) { 
                wadahWacana.classList.remove('hidden'); 
                wadahWacana.innerHTML = s.wacana; 
            } else { 
                wadahWacana.classList.add('hidden'); 
            }
            
            document.getElementById('konten-pertanyaan').innerHTML = s.pertanyaan;
            const containerPilihan = document.getElementById('wadah-pilihan');
            containerPilihan.innerHTML = '';
            
            const savedAns = jawabanSiswa[indeks] || []; 

            if (s.tipe === 'Benar Salah') {
                const header1 = s.headerTabel ? s.headerTabel[0] : "Benar";
                const header2 = s.headerTabel ? s.headerTabel[1] : "Salah";
                
                let htmlTable = `
                    <div class="overflow-hidden border border-blue-300 rounded-xl mb-2 shadow-sm">
                    <table class="w-full text-sm text-left" style="border:none;">
                        <thead class="bg-blue-100 text-blue-900 font-bold" style="border-bottom: 2px solid #93c5fd;">
                            <tr>
                                <th class="p-3" style="border:none;">Pernyataan</th>
                                <th class="p-3 text-center w-20" style="border:none;">${header1}</th>
                                <th class="p-3 text-center w-20" style="border:none;">${header2}</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white">
                `;
                s.pilihan.forEach((pil, i) => {
                    const valB = i + "_B";
                    const valS = i + "_S";
                    const isCheckedB = savedAns.includes(valB) ? "checked" : "";
                    const isCheckedS = savedAns.includes(valS) ? "checked" : "";
                    
                    htmlTable += `
                        <tr class="hover:bg-blue-50 transition" style="border-bottom: 1px solid #e5e7eb;">
                            <td class="p-3 text-gray-700 leading-snug" style="border:none;">${pil}</td>
                            <td class="p-3 text-center align-middle" style="border:none; border-left: 1px solid #e5e7eb;">
                                <input type="radio" name="bs_${i}" value="${valB}" ${isCheckedB} onchange="simpanJawabanSaatIni()" class="w-5 h-5 accent-blue-600 cursor-pointer">
                            </td>
                            <td class="p-3 text-center align-middle" style="border:none; border-left: 1px solid #e5e7eb;">
                                <input type="radio" name="bs_${i}" value="${valS}" ${isCheckedS} onchange="simpanJawabanSaatIni()" class="w-5 h-5 accent-blue-600 cursor-pointer">
                            </td>
                        </tr>
                    `;
                });
                htmlTable += `</tbody></table></div>`;
                containerPilihan.innerHTML = htmlTable;
            } 
            else {
                const type = s.tipe === 'Ganda Kompleks' ? 'checkbox' : 'radio';
                s.pilihan.forEach((pil, i) => {
                    const isChecked = savedAns.includes(i) ? "checked" : "";
                    containerPilihan.innerHTML += `
                        <label class="flex items-center gap-3 p-3 bg-white border border-gray-300 rounded-lg mb-2 cursor-pointer hover:bg-blue-50 active:bg-blue-100 transition shadow-sm">
                            <input type="${type}" name="jawaban" value="${i}" ${isChecked} onchange="simpanJawabanSaatIni()" class="w-5 h-5 text-blue-600">
                            <span class="text-gray-800 font-medium text-sm md:text-base leading-snug w-full">${pil}</span>
                        </label>
                    `;
                });
            }

            // PERBAIKAN BUG TOMBOL (Menggunakan classList, BUKAN style.display)
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnSelesai = document.getElementById('btn-selesai');

            if (indeks === 0) {
                btnPrev.classList.add('hidden');
            } else {
                btnPrev.classList.remove('hidden');
            }

            if (indeks === paketSoalTKA.length - 1) {
                btnNext.classList.add('hidden');
                btnSelesai.classList.remove('hidden');
            } else {
                btnNext.classList.remove('hidden');
                btnSelesai.classList.add('hidden');
            }
        }

        function gantiSoal(arah) {
            simpanJawabanSaatIni();
            const newIndex = currentIndex + arah;
            if (newIndex >= 0 && newIndex < paketSoalTKA.length) {
                currentIndex = newIndex;
                renderSoal(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function hitungSkor() {
            let skor = 0;
            const bobotSoal = 100 / paketSoalTKA.length;
            
            for (let i = 0; i < paketSoalTKA.length; i++) {
                const kunci = paketSoalTKA[i].kunci;
                const jawab = jawabanSiswa[i] || [];
                if (JSON.stringify(kunci.slice().sort()) === JSON.stringify(jawab.slice().sort())) {
                    skor += bobotSoal;
                }
            }
            return Math.round(skor);
        }

        function kumpulkanJawaban(autoSubmit) {
            simpanJawabanSaatIni();
            
            if (!autoSubmit) {
                let totalTerjawab = jawabanSiswa.filter(ans => ans && ans.length > 0).length;
                if (totalTerjawab < paketSoalTKA.length) {
                    if (!confirm(`Ada ${paketSoalTKA.length - totalTerjawab} soal belum dijawab. Yakin selesai?`)) return;
                } else {
                    if (!confirm(`Semua soal telah terjawab. Kumpulkan sekarang?`)) return;
                }
            }

            clearInterval(timerInterval);
            
            const nilaiAkhir = hitungSkor();

            document.getElementById('area-ujian').classList.add('hidden');
            document.getElementById('layar-hasil').classList.remove('hidden');
            document.getElementById('nama-hasil').innerText = namaAktif;
            document.getElementById('skor-akhir').innerText = nilaiAkhir;

            localStorage.removeItem('jawaban_bhs_' + namaAktif);
            localStorage.removeItem('index_bhs_' + namaAktif);
        }
    </script>
</body>
</html>
